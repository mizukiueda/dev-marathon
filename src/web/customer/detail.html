<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>顧客詳細</title>
<!-- Bootstrap CSSの読み込み -->
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
<h1 class="mb-4">顧客詳細</h1>
<table class="table table-bordered">
<tbody>
<tr>
<th>ID</th>
<td id="customer_id"></td>
</tr>
<tr>
<th>会社名</th>
<td id="company_name"></td>
</tr>
<tr>
<th>業種</th>
<td id="industry"></td>
</tr>
<tr>
<th>連絡先</th>
<td id="contact"></td>
</tr>
<tr>
<th>所在地</th>
<td id="location"></td>
</tr>
</tbody>
</table>
<a href="/customer/list.html" class="btn btn-secondary">一覧に戻る</a>
<button id="btn-edit" class="btn btn-primary">編集</button>
<button id="btn-delete" class="btn btn-danger">削除</button>
</div>
<script type="module">
import config from "./config.js";
const params = new URLSearchParams(window.location.search);
const id = params.get("id");
        fetch(`${config.apiUrl}/customers/${id}`)
          .then((response) => response.json())
          .then((customer) => {
            document.getElementById("customer_id").textContent = customer.customer_id;
            document.getElementById("company_name").textContent = customer.company_name;
            document.getElementById("industry").textContent = customer.industry;
            document.getElementById("contact").textContent = customer.contact;
            document.getElementById("location").textContent = customer.location;
          })
          .catch((error) => console.error(error));
        document.getElementById("btn-edit").addEventListener("click", function() {
            window.location.href = `/customer/update.html?id=${id}`;
        });
        document.getElementById("btn-delete").addEventListener("click", function() {
if (confirm("削除していいですか?")) {
                fetch(`${config.apiUrl}/customers/${id}`, {
                    method: "DELETE",
                })
                .then((response) => response.json())
                .then((data) => {
if (data.success) {
                        alert("削除しました。");
                        window.location.href = "/customer/list.html";
                    } else {
                        alert("削除に失敗しました。");
                    }
                })
                .catch((error) => console.error(error));
            }
        });
</script>
<!-- BootstrapのJavaScriptと依存関係のリンク -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
